<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Match Analysis — Football Hub</title>
<style>
  :root{--ink:#12161c;--muted:#5b6675;--line:#e2e6ec;--brand:#0a7d3c}
  *{box-sizing:border-box}
  body{margin:0;background:#f7f8fa;color:var(--ink);font:16px/1.6 Georgia,"Source Serif 4",serif}
  header.m{background:#0f1420;color:#fff;padding:16px 20px}
  header.m a{color:#fff;text-decoration:none;font-weight:700;font-family:system-ui,sans-serif}
  header.m .nav a{margin-right:16px;font-weight:600;opacity:.85;font-size:14px}
  main{max-width:820px;margin:0 auto;padding:26px 20px 60px}
  h1{font-family:system-ui,sans-serif;font-size:30px;line-height:1.2;margin:10px 0 4px}
  h2{font-family:system-ui,sans-serif;font-size:20px;margin:30px 0 10px}
  .meta{color:var(--muted);font-size:14px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .chip{background:#eef1f5;border-radius:999px;padding:4px 12px;font-size:13px;font-family:system-ui,sans-serif}
  .scoreboard{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:16px 0}
  .scoreboard .t{font-family:system-ui,sans-serif;font-weight:800;font-size:20px}
  .scoreboard .s{font-family:system-ui,sans-serif;font-weight:800;font-size:32px;color:var(--brand)}
  .embed{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin:18px 0}
  .embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .fact{border-left:3px solid var(--brand);padding:4px 12px;margin:8px 0}
  .obs{border-left:3px solid #38bdf8;padding:4px 12px;margin:8px 0}
  .inf{border-left:3px solid #f59e0b;padding:4px 12px;margin:8px 0}
  .pill{font-size:12px;font-family:system-ui,sans-serif;background:#eef1f5;color:var(--muted);border-radius:6px;padding:2px 8px;margin-left:6px}
  table{width:100%;border-collapse:collapse;font-size:14px;font-family:system-ui,sans-serif}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .cta{display:block;background:var(--brand);color:#fff;text-align:center;padding:14px;border-radius:10px;text-decoration:none;font-family:system-ui,sans-serif;font-weight:700;margin:22px 0}
  .share a{display:inline-block;margin-right:10px;font-family:system-ui,sans-serif;font-size:14px}
  .related a{display:block;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
  .notice{background:#fff8e6;border:1px solid #f3d27a;color:#6b5320;padding:12px 14px;border-radius:10px;font-size:14px}
  .loading{color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<header class="m">
  <div class="nav">
    <a href="/">Football Hub</a>
    <span style="margin-left:16px"></span>
    <a href="/admin">Analyst Studio</a>
  </div>
</header>
<main id="article" class="loading">Loading analysis…</main>
<script>
(function () {
  function q(name) { return new URLSearchParams(location.search).get(name); }
  const slug = q("utm_content") || location.pathname.split("/").filter(Boolean).pop();
  const root = document.getElementById("article");

  function trackLanding() {
    const p = new URLSearchParams(location.search);
    const body = JSON.stringify({
      source: p.get("utm_source") || "direct",
      medium: p.get("utm_medium") || "",
      campaign: p.get("utm_campaign") || "",
      content: p.get("utm_content") || slug,
      match_id: slug,
      path: location.pathname,
    });
    try {
      if (navigator.sendBeacon) navigator.sendBeacon("/api/analytics", new Blob([body], { type: "application/json" }));
      else fetch("/api/analytics", { method: "POST", headers: { "Content-Type": "application/json" }, body: body, keepalive: true });
    } catch (e) { /* analytics must never break the page */ }
  }

  const ENT = { "&": "amp", "<": "lt", ">": "gt", '"': "quot", "'": "#39" };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return "&" + ENT[c] + ";"; });
  }
  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
  }
  function list(items, cls) {
    if (!items || !items.length) return '<div class="meta">None recorded.</div>';
    return items.map(function (x) {
      const text = typeof x === "string" ? x : (x.text || x.claim || x.statement || "");
      const conf = x && x.confidence != null ? '<span class="pill">' + Math.round(x.confidence * 100) + "%</span>" : "";
      const src = x && x.source ? '<span class="pill">' + esc(x.source) + "</span>" : "";
      return '<div class="' + cls + '">' + esc(text) + conf + src + "</div>";
    }).join("");
  }
  function reportBlock(rep) {
    if (!rep || !Object.keys(rep).length) return '<div class="meta">No report available.</div>';
    return Object.entries(rep).map(function (kv) {
      const val = Array.isArray(kv[1]) ? kv[1].join(" ") : kv[1];
      return '<div style="margin-bottom:14px"><b>' + esc(kv[0].replace(/_/g, " ")) + "</b><div>" + esc(val) + "</div></div>";
    }).join("");
  }

  function render(d) {
    const a = d.article || {};
    const m = a.match || {};
    const y = a.youtube || {};
    const title = (m.home_team || "Match") + (m.away_team ? " vs " + m.away_team : "");
    const score = m.score && m.score !== "-" ? m.score : "";

    let html = "";
    html += '<div class="chips"><span class="chip">' + esc(m.competition || "Football") + "</span>" +
      (m.match_date ? '<span class="chip">' + esc(m.match_date) + "</span>" : "") + "</div>";
    html += "<h1>" + esc(title) + "</h1>";

    if (score) {
      html += '<div class="scoreboard"><div class="t">' + esc(m.home_team || "") +
        '</div><div class="s">' + esc(score) + '</div><div class="t">' + esc(m.away_team || "") + "</div></div>";
    }

    if (y.embed_url) {
      html += '<div class="embed"><iframe src="' + esc(y.embed_url) +
        '" title="Source video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
      html += '<div class="meta">Source: ' + esc(y.channel || "") + " · " + fmtDate(y.published_at) +
        ' · <a href="' + esc(y.youtube_url || "#") + '" target="_blank" rel="noopener">Watch on YouTube</a>' +
        (y.media_status ? ' <span class="pill">' + esc(y.media_status) + "</span>" : "") + "</div>";
    }

    if (!d.published) {
      html += '<div class="notice" style="margin-top:16px">This analysis is in review and not yet published.</div>';
    }

    html += "<h2>Match summary</h2><div>" + esc((a.report && (a.report.summary || a.report.match_summary)) || "Analysis pending.") + "</div>";
    html += '<a class="cta" href="/">Read more football analysis on Football Hub</a>';

    html += "<h2>Key moments</h2>";
    const events = a.key_events || [];
    if (events.length) {
      html += "<table><thead><tr><th>Time</th><th>Event</th><th>Team</th><th>Evidence</th><th>Confidence</th></tr></thead><tbody>" +
        events.map(function (e) {
          return "<tr><td>" + esc(e.timestamp || "") + "</td><td>" + esc(e.event_type || "") +
            "</td><td>" + esc(e.team || "") + "</td><td>" + esc(e.evidence || "") +
            "</td><td>" + (e.confidence != null ? Math.round(e.confidence * 100) + "%" : "") + "</td></tr>";
        }).join("") + "</tbody></table>";
    } else {
      html += '<div class="meta">No authorized footage analyzed. Video-level tactical analysis requires authorized source footage.</div>';
    }

    html += "<h2>Facts</h2>" + list(a.facts, "fact");
    html += "<h2>Observations</h2>" + list(a.observations, "obs");
    html += "<h2>Inferences</h2>";
    html += '<div class="meta">Inferences are not confirmed facts.</div>' + list(a.inferences, "inf");
    html += "<h2>Tactical & player analysis</h2>" + reportBlock(a.report);

    const shareUrl = encodeURIComponent(location.href);
    html += '<h2>Share</h2><div class="share">' +
      '<a href="https://twitter.com/intent/tweet?url=' + shareUrl + '&text=' + encodeURIComponent(title) + '" target="_blank" rel="noopener">Twitter / X</a>' +
      '<a href="https://www.facebook.com/sharer/sharer.php?u=' + shareUrl + '" target="_blank" rel="noopener">Facebook</a>' +
      '<a href="https://wa.me/?text=' + shareUrl + '" target="_blank" rel="noopener">WhatsApp</a></div>';

    if (d.related && d.related.length) {
      html += '<h2>Related matches</h2><div class="related">' +
        d.related.map(function (r) {
          return '<a href="/analysis/' + encodeURIComponent(r.slug || "") + '">' +
            esc((r.home_team || "") + " vs " + (r.away_team || "")) + " — " + esc(r.competition || "") + "</a>";
        }).join("") + "</div>";
    }

    if (y.youtube_url) {
      html += '<p class="meta" style="margin-top:26px">Source video: <a href="' + esc(y.youtube_url) +
        '" target="_blank" rel="noopener">' + esc(y.title || y.youtube_url) + "</a></p>";
    }

    root.className = "";
    root.innerHTML = html;
  }

  function fail(msg) {
    root.className = "";
    root.innerHTML = '<h1>Analysis unavailable</h1><p class="meta">' + esc(msg || "Not found.") +
      '</p><a class="cta" href="/">Back to Football Hub</a>';
  }

  trackLanding();
  if (!slug) { fail("No analysis specified."); return; }

  fetch("/api/article?slug=" + encodeURIComponent(slug))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok || res.j.error) return fail(res.j.error || "Not found.");
      render(res.j);
    })
    .catch(function (e) { fail(e.message); });
})();
</script>
</body>
</html>
